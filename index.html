<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<title>Where I Am</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink:#14213d; --paper:#f3f6fb; --signal:#1f5bff; --ok:#1a8f5a; --warn:#b3261e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--paper); }
  #map { position: fixed; inset: 0; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 18px 18px 0 0; padding: 16px 18px calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -6px 24px rgba(20,33,61,.18); z-index: 1000; max-width: 560px; margin: 0 auto; }
  .status { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; font-weight: 650; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #9aa5b8; flex: none; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 0 rgba(26,143,90,.6); animation: pulse 1.8s infinite; }
  .dot.err { background: var(--warn); }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(26,143,90,0); } 100% { box-shadow: 0 0 0 0 rgba(26,143,90,0); } }
  @media (prefers-reduced-motion: reduce) { .dot.live { animation: none; } }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .cell { background: var(--paper); border-radius: 10px; padding: 9px 10px; }
  .cell b { display: block; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
  .cell span { font-size: .78rem; color: #55627a; }
  .coords { font-size: .92rem; color: #3a4762; font-variant-numeric: tabular-nums; min-height: 1.3em; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; font: inherit; font-weight: 650; padding: 13px 10px; border-radius: 12px; border: 2px solid var(--ink); background: #fff; color: var(--ink); min-height: 48px; }
  button.primary { background: var(--signal); border-color: var(--signal); color: #fff; }
  button:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }
  button:active { transform: scale(.98); }
  .me { width: 18px; height: 18px; border-radius: 50%; background: var(--signal); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--signal), 0 2px 8px rgba(0,0,0,.35); }
  .leaflet-control-zoom { margin-bottom: 0 !important; }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map showing your location"></div>

<section class="sheet" aria-live="polite">
  <div class="status"><span id="dot" class="dot"></span><span id="status">Tap Start to find your location</span></div>
  <div class="grid">
    <div class="cell"><b id="acc">–</b><span>Accuracy</span></div>
    <div class="cell"><b id="spd">–</b><span>Speed</span></div>
    <div class="cell"><b id="upd">–</b><span>Last update</span></div>
  </div>
  <div class="coords" id="coords"></div>
  <div class="row">
    <button id="go" class="primary">Start</button>
    <button id="center">Center</button>
    <button id="share">Copy link</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var map = L.map('map', { zoomControl: true }).setView([20, 0], 2);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  var marker = null, circle = null, trail = L.polyline([], { color: '#1f5bff', weight: 4, opacity: .6 }).addTo(map);
  var watchId = null, last = null, first = true;

  var $ = function (id) { return document.getElementById(id); };
  function setStatus(text, cls) { $('status').textContent = text; $('dot').className = 'dot ' + (cls || ''); }

  function onPos(p) {
    var c = p.coords, ll = [c.latitude, c.longitude];
    last = ll;
    if (!marker) {
      marker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(map);
      circle = L.circle(ll, { radius: c.accuracy, color: '#1f5bff', weight: 1, fillOpacity: .1 }).addTo(map);
    } else {
      marker.setLatLng(ll); circle.setLatLng(ll); circle.setRadius(c.accuracy);
    }
    trail.addLatLng(ll);
    if (first) { map.setView(ll, 17); first = false; }
    setStatus('Live location on', 'live');
    $('acc').textContent = Math.round(c.accuracy) + ' m';
    $('spd').textContent = c.speed != null && !isNaN(c.speed) ? Math.round(c.speed * 3.6) + ' km/h' : '–';
    $('upd').textContent = new Date(p.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    $('coords').textContent = c.latitude.toFixed(5) + ', ' + c.longitude.toFixed(5);
  }

  function onErr(e) {
    var msg = e.code === 1 ? 'Location is blocked. Allow location for this site in Chrome settings.'
            : e.code === 2 ? 'Location unavailable. Turn on GPS and try again.'
            : 'Location timed out. Try again.';
    setStatus(msg, 'err'); stop(true);
  }

  function start() {
    if (!navigator.geolocation) { setStatus('This browser has no location support.', 'err'); return; }
    setStatus('Finding you…'); first = true;
    watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
    $('go').textContent = 'Stop'; $('go').classList.remove('primary');
  }
  function stop(keepMsg) {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    $('go').textContent = 'Start'; $('go').classList.add('primary');
    if (!keepMsg) setStatus('Stopped. Tap Start to resume');
  }

  $('go').addEventListener('click', function () { watchId === null ? start() : stop(); });
  $('center').addEventListener('click', function () { if (last) map.setView(last, Math.max(map.getZoom(), 16)); });
  $('share').addEventListener('click', function () {
    if (!last) { setStatus('Start tracking first to get a link.'); return; }
    var url = 'https://www.google.com/maps?q=' + last[0] + ',' + last[1];
    var done = function () { setStatus('Link copied', 'live'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, function () { prompt('Copy this link', url); });
    else prompt('Copy this link', url);
  });
})();
</script>
</body>
</html>
